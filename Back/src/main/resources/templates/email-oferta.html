<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body style="background: #0f0f0f; font-family: 'Segoe UI', Arial, sans-serif; color: #e0e0e0; padding: 30px;">
<div style="max-width: 600px; margin: auto; background: #1a1a1a; border-radius: 12px; padding: 25px; border: 1px solid #2a2a2a;">

    <h1 th:style="'color:' + ${color} + '; font-size: 24px;'" th:text="${titulo}">Título</h1>
    <p style="font-size: 16px; color: #ccc;" th:text="${intro}">Intro</p>

    <!-- Bucle de ofertas -->
    <div th:each="oferta : ${ofertas}"
         style="background: linear-gradient(145deg, #1e1e1e, #252525); padding: 20px; margin: 15px 0; border-radius: 10px; border: 1px solid #333;">
        <table width="100%">
            <tr>
                <td>
                    <div style="font-size: 18px; font-weight: bold; color: #ffffff;" th:text="${oferta.nombre}">Nombre</div>
                    <div style="font-size: 24px; font-weight: bold;" th:styleappend="'color:' + ${color}" th:text="${oferta.precio} + '€'">0.00€</div>
                </td>
                <td style="text-align: right;">
                    <a th:href="${oferta.url}"
                       th:style="'background:' + ${color} + '; color: #ffffff; text-decoration: none; padding: 12px 16px; border-radius: 6px; font-weight: bold;'">
                        ⚡ VER BOTÍN
                    </a>
                </td>
            </tr>
        </table>
    </div>

    <p style="margin-top: 25px; color: #aaa;" th:text="${cierre}">Cierre</p>
</div>
</body>
</html>
