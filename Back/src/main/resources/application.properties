spring.application.name=QuestHub
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
server.port=${PORT:8080}

spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

#Configuración para Resend (SMTP)
spring.mail.host=smtp.resend.com
spring.mail.port=465
spring.mail.username=resend

#¡IMPORTANTE! Cambia esto para que Spring lo reconozca:
spring.mail.password=${MAIL_PASSWORD}

#Configuración de seguridad para puerto 465 (SSL)
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory

#Esto es opcional pero ayuda a debuguear errores de conexión
spring.mail.properties.mail.debug=true

app.mail.from=onboarding@resend.dev

#SUPABASE
supabase.url=${SUPABASE_URL}
supabase.service_role_key=${SUPABASE_SERVICE_ROLE_KEY}
